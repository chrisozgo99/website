name: Update dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

# This workflow opens a PR, so it needs write access - but only these two
# scopes, not the default full token.
permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    strategy:
      matrix:
        node-version: [22.x]

    name: Update all dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci

      - run: npx npm-check-updates -u # Update dependencies
      - run: rm -Rf node_modules package-lock.json
      - run: npm install
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "build: update dependencies to the latest version"
          title: Update dependencies to the latest version
          branch: automated/update-dependencies
          delete-branch: true
