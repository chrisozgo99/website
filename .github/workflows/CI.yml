name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no job here needs to write to the repo.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci

  test:
    strategy:
      matrix:
        node-version: [20.x]

    name: Run all tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Retrieve Git history, needed to verify commits
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # Runs before `npm ci` so a tampered config is caught before any
      # install script or build step can execute it.
      - name: Config integrity
        run: npm run check-config

      - run: npm ci

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Linter
        run: npm run lint

      - name: Type checking
        run: npm run check-types

      - name: Run unit tests
        run: npm run test
        env:
          NEXT_PUBLIC_GHOST_URL: ${{ secrets.NEXT_PUBLIC_GHOST_URL }}
          NEXT_PUBLIC_GHOST_KEY: ${{ secrets.NEXT_PUBLIC_GHOST_KEY }}
          NEXT_PUBLIC_GHOST_ADMIN_KEY: ${{ secrets.NEXT_PUBLIC_GHOST_ADMIN_KEY }}
          NEXT_PUBLIC_GHOST_URL_2: ${{ secrets.NEXT_PUBLIC_GHOST_URL_2 }}
          NEXT_PUBLIC_GHOST_KEY_2: ${{ secrets.NEXT_PUBLIC_GHOST_KEY_2 }}
          NEXT_PUBLIC_GHOST_ADMIN_KEY_2: ${{ secrets.NEXT_PUBLIC_GHOST_ADMIN_KEY_2 }}
          NEXT_PUBLIC_DISQUS_SHORTNAME: ${{ secrets.NEXT_PUBLIC_DISQUS_SHORTNAME }}

      - name: Run storybook tests
        run: npm run test-storybook:ci

      # - name: Run e2e tests
      #   run: npx percy exec -- npm run e2e:headless
      #   env:
      #       PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
